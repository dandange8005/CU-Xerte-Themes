<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Objective Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .header-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .header-link:hover {
            background: #667eea;
            color: white;
        }

        .preview-section {
            background: white;
            padding: 30px;
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
        }

        .preview-text {
            font-size: 24px;
            color: #333;
            line-height: 1.6;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .filled {
            color: #667eea;
            font-weight: 600;
        }

        .placeholder {
            color: #999;
            font-style: italic;
        }

        .add-icon {
            color: #667eea;
            margin: 0 8px;
            font-weight: bold;
        }

        .progress-nav {
            background: white;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .progress-step {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
        }

        .progress-step.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .progress-step.completed {
            color: #333;
        }

        .main-content {
            background: white;
            padding: 40px 30px;
            min-height: 400px;
            border-radius: 0 0 12px 12px;
        }

        .step-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .step-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .text-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .helper-text {
            font-size: 14px;
            color: #999;
            margin-top: 8px;
        }

        .example-text {
            font-size: 14px;
            color: #666;
            margin-top: 15px;
        }

        .example-text strong {
            color: #333;
        }

        .taxonomy-section {
            margin-bottom: 30px;
        }

        .taxonomy-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .taxonomy-levels {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .taxonomy-level {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            font-weight: 500;
        }

        .taxonomy-level:hover {
            background: #e8e8e8;
        }

        .taxonomy-level.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .verbs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .verb-button {
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .verb-button:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .verb-button.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .result-section {
            text-align: center;
        }

        .result-box {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
        }

        .result-text {
            font-size: 22px;
            color: #333;
            line-height: 1.8;
        }

        .footer {
            background: white;
            padding: 20px 30px;
            margin-top: 20px;
            border-radius: 12px;
            text-align: center;
            color: #666;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .preview-text {
                font-size: 18px;
            }

            .verbs-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const bloomsTaxonomy = {
            'Remembering': ['ARRANGE', 'DEFINE', 'DESCRIBE', 'DUPLICATE', 'IDENTIFY', 'LABEL', 'LIST', 'MATCH', 'MEMORIZE', 'NAME', 'ORDER', 'OUTLINE', 'RECALL', 'RECOGNIZE', 'RELATE', 'REPEAT', 'REPRODUCE', 'SELECT', 'SHOW', 'STATE'],
            'Understanding': ['CLASSIFY', 'COMPARE', 'CONTRAST', 'DEMONSTRATE', 'EXPLAIN', 'EXTEND', 'ILLUSTRATE', 'INFER', 'INTERPRET', 'PARAPHRASE', 'PREDICT', 'RELATE', 'REPHRASE', 'SHOW', 'SUMMARIZE', 'TRANSLATE'],
            'Applying': ['APPLY', 'BUILD', 'CHOOSE', 'CONSTRUCT', 'DEVELOP', 'EXPERIMENT', 'IDENTIFY', 'INTERVIEW', 'MAKE USE OF', 'MODEL', 'ORGANIZE', 'PLAN', 'SELECT', 'SOLVE', 'UTILIZE'],
            'Analyzing': ['ANALYZE', 'APPRAISE', 'BREAK DOWN', 'CALCULATE', 'CATEGORIZE', 'COMPARE', 'CONTRAST', 'CRITICIZE', 'DIFFERENTIATE', 'DISCRIMINATE', 'DISTINGUISH', 'EXAMINE', 'EXPERIMENT', 'QUESTION', 'TEST'],
            'Evaluating': ['APPRAISE', 'ARGUE', 'ASSESS', 'ATTACH', 'CHOOSE', 'COMPARE', 'CONCLUDE', 'CONTRAST', 'DEFEND', 'ESTIMATE', 'EVALUATE', 'JUDGE', 'JUSTIFY', 'PREDICT', 'RATE', 'SELECT', 'SUPPORT', 'VALUE'],
            'Creating': ['ASSEMBLE', 'COMBINE', 'COMPILE', 'COMPOSE', 'CONSTRUCT', 'CREATE', 'DESIGN', 'DEVELOP', 'DEVISE', 'FORMULATE', 'GENERATE', 'INTEGRATE', 'INVENT', 'MAKE', 'MODIFY', 'ORGANIZE', 'PERFORM', 'PLAN', 'PRODUCE', 'PROPOSE', 'REARRANGE', 'RECONSTRUCT', 'REORGANIZE', 'REVISE', 'REWRITE', 'WRITE']
        };

        class LearningObjectiveMaker {
            constructor() {
                this.step = 1;
                this.audience = '';
                this.selectedLevel = 'Remembering';
                this.selectedVerb = '';
                this.goal = '';
                this.condition = '';
                this.render();
            }

            updatePreview() {
                const previewEl = document.getElementById('preview-text');
                if (!previewEl) return;

                let html = '';
                
                if (this.audience) {
                    html += `<span class="filled">${this.audience}</span>`;
                } else {
                    html += `<span class="placeholder">[who]</span>`;
                }
                
                html += '<span> will be able to </span>';
                
                if (this.selectedVerb) {
                    html += `<span class="filled">${this.selectedVerb.toLowerCase()} </span>`;
                } else {
                    html += '<span class="add-icon">+</span><span class="placeholder">[verb] </span>';
                }
                
                if (this.goal) {
                    html += `<span class="filled">${this.goal}</span>`;
                } else {
                    html += '<span class="add-icon">+</span><span class="placeholder"> [goal]</span>';
                }
                
                if (this.condition) {
                    html += `<span class="filled"> ${this.condition}</span>`;
                } else {
                    html += '<span class="add-icon">+</span><span class="placeholder">[condition]</span>';
                }
                
                previewEl.innerHTML = html;
            }

            canProceed() {
                if (this.step === 1) return this.audience.trim() !== '';
                if (this.step === 2) return this.selectedVerb !== '' && this.goal.trim() !== '';
                if (this.step === 3) return this.condition.trim() !== '';
                return true;
            }

            nextStep() {
                if (this.canProceed()) {
                    this.step++;
                    this.render();
                }
            }

            prevStep() {
                if (this.step > 1) {
                    this.step--;
                    this.render();
                }
            }

            goToStep(targetStep) {
                if (targetStep < this.step) {
                    this.step = targetStep;
                    this.render();
                }
            }

            reset() {
                this.step = 1;
                this.audience = '';
                this.selectedLevel = 'Remembering';
                this.selectedVerb = '';
                this.goal = '';
                this.condition = '';
                this.render();
            }

            copyToClipboard() {
                const text = `${this.audience} will be able to ${this.selectedVerb.toLowerCase()} ${this.goal} ${this.condition}`;
                navigator.clipboard.writeText(text).then(() => {
                    alert('Learning objective copied to clipboard!');
                });
            }

            render() {
                const app = document.getElementById('app');
                
                let content = `
                    <div class="container">
                        <header class="header">
                            <div class="logo">Learning Objective Maker</div>
                            <a href="#" class="header-link">Create objective</a>
                        </header>
                `;

                if (this.step < 4) {
                    content += `
                        <div class="preview-section">
                            <div class="preview-text" id="preview-text"></div>
                        </div>
                        <nav class="progress-nav">
                            <div class="progress-step ${this.step === 1 ? 'active' : this.step > 1 ? 'completed' : ''}" onclick="app.goToStep(1)">WHO?</div>
                            <div class="progress-step ${this.step === 2 ? 'active' : this.step > 2 ? 'completed' : ''}" onclick="app.goToStep(2)">WHAT?</div>
                            <div class="progress-step ${this.step === 3 ? 'active' : this.step > 3 ? 'completed' : ''}" onclick="app.goToStep(3)">HOW?</div>
                            <div class="progress-step ${this.step === 4 ? 'active' : ''}">GET LO</div>
                        </nav>
                    `;
                }

                content += '<main class="main-content">';

                if (this.step === 1) {
                    content += `
                        <h2 class="step-title">Who is the learner?</h2>
                        <div class="input-group">
                            <input type="text" class="text-input" id="audience-input" value="${this.audience}" placeholder="Enter audience..." />
                            <div class="helper-text">Describe your audience in as much detail as possible</div>
                            <div class="example-text"><strong>Example:</strong> Application Engineer - Intermediate</div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-primary" id="next-btn" ${!this.canProceed() ? 'disabled' : ''}>Next</button>
                        </div>
                    `;
                } else if (this.step === 2) {
                    content += `
                        <h2 class="step-title">Choose the Level of Knowledge to Obtain</h2>
                        <p class="step-subtitle">Based on Bloom's Taxonomy</p>
                        <div class="taxonomy-section">
                            <div class="taxonomy-levels">
                                ${Object.keys(bloomsTaxonomy).map(level => 
                                    `<div class="taxonomy-level ${this.selectedLevel === level ? 'active' : ''}" onclick="app.selectLevel('${level}')">${level}</div>`
                                ).join('')}
                            </div>
                            <div class="verbs-grid" id="verbs-grid"></div>
                        </div>
                        <div class="input-group">
                            <h3 class="taxonomy-title">What is the task the learner has to do?</h3>
                            <input type="text" class="text-input" id="goal-input" value="${this.goal}" placeholder="Enter goal..." />
                            <div class="helper-text">Describe the task in as much detail as possible</div>
                            <div class="example-text"><strong>Example:</strong> Philosophy of Mind and what it means for something to have a mind</div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-secondary" onclick="app.prevStep()">Back</button>
                            <button class="btn btn-primary" id="next-btn" ${!this.canProceed() ? 'disabled' : ''}>Next</button>
                        </div>
                    `;
                } else if (this.step === 3) {
                    content += `
                        <h2 class="step-title">What's the condition?</h2>
                        <div class="input-group">
                            <input type="text" class="text-input" id="condition-input" value="${this.condition}" placeholder="Enter condition..." />
                            <div class="helper-text">Describe the conditions of performing the task</div>
                            <div class="example-text"><strong>Example:</strong> during a first prospect meeting</div>
                        </div>
                        <div class="button-group">
                            <button class="btn btn-secondary" onclick="app.prevStep()">Back</button>
                            <button class="btn btn-primary" id="next-btn" ${!this.canProceed() ? 'disabled' : ''}>Generate Learning Objective</button>
                        </div>
                    `;
                } else if (this.step === 4) {
                    content += `
                        <div class="result-section">
                            <h2 class="step-title">Your Learning Objective</h2>
                            <div class="result-box">
                                <div class="result-text">
                                    ${this.audience} will be able to ${this.selectedVerb.toLowerCase()} ${this.goal} ${this.condition}
                                </div>
                            </div>
                            <div class="button-group">
                                <button class="btn btn-secondary" onclick="app.reset()">New learning objective</button>
                                <button class="btn btn-primary" onclick="app.copyToClipboard()">Copy to clipboard</button>
                            </div>
                        </div>
                    `;
                }

                content += `
                    </main>
                    <footer class="footer">
                        <p>Built for educational design • Based on Bloom's Taxonomy</p>
                    </footer>
                </div>
                `;

                app.innerHTML = content;
                
                // Update preview
                this.updatePreview();

                // Add event listeners
                this.addEventListeners();

                // Render verbs if on step 2
                if (this.step === 2) {
                    this.renderVerbs();
                }
            }

            renderVerbs() {
                const verbsGrid = document.getElementById('verbs-grid');
                if (!verbsGrid) return;

                verbsGrid.innerHTML = bloomsTaxonomy[this.selectedLevel].map(verb => 
                    `<button class="verb-button ${this.selectedVerb === verb ? 'selected' : ''}" onclick="app.selectVerb('${verb}')">${verb}</button>`
                ).join('');
            }

            selectLevel(level) {
                this.selectedLevel = level;
                this.renderVerbs();
            }

            selectVerb(verb) {
                this.selectedVerb = verb;
                this.renderVerbs();
                this.updatePreview();
                this.updateNextButton();
            }

            updateNextButton() {
                const nextBtn = document.getElementById('next-btn');
                if (nextBtn) {
                    nextBtn.disabled = !this.canProceed();
                }
            }

            addEventListeners() {
                const audienceInput = document.getElementById('audience-input');
                if (audienceInput) {
                    audienceInput.addEventListener('input', (e) => {
                        this.audience = e.target.value;
                        this.updatePreview();
                        this.updateNextButton();
                    });
                    audienceInput.focus();
                }

                const goalInput = document.getElementById('goal-input');
                if (goalInput) {
                    goalInput.addEventListener('input', (e) => {
                        this.goal = e.target.value;
                        this.updatePreview();
                        this.updateNextButton();
                    });
                }

                const conditionInput = document.getElementById('condition-input');
                if (conditionInput) {
                    conditionInput.addEventListener('input', (e) => {
                        this.condition = e.target.value;
                        this.updatePreview();
                        this.updateNextButton();
                    });
                    conditionInput.focus();
                }

                const nextBtn = document.getElementById('next-btn');
                if (nextBtn) {
                    nextBtn.addEventListener('click', () => this.nextStep());
                }
            }
        }

        // Initialize the app
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new LearningObjectiveMaker();
            window.app = app; // Make it globally accessible for onclick handlers
        });
    </script>
</body>
</html>
