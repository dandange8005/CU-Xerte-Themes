<!-- SVEM Title Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVEM - Student Voice Enhancement Model</title>
    <link rel="stylesheet" href="custom.css">
</head>
<body>

<main class="title-page">
  <div class="title-page__content"><img alt="Cardiff University" class="title-page__logo" height="56" src="https://xerte.cardiff.ac.uk/USER-FILES/24007-sopnz-Nottingham/media/cu-logo-primary.png" width="56" />
    <p class="title-page__university">Cardiff University
    </p>
    <h1 class="title-page__heading">Student Voice <span>Enhancement Model</span>
    </h1>
    <p class="title-page__description">A comprehensive self‑reflection tool designed to help strengthen and enhance student engagement mechanisms and structures across the university.
    </p>
    <button class="btn btn-primary btn-lg title-page__btn" onclick="x_navigateToPage(false, {type:'linkID', ID:'[next]'}); return false;" type="button">Enter Resource
    </button>
  </div>
  <div class="title-page__visual"><img alt="Score dashboard preview" class="title-page__card" height="490" src="https://xerte.cardiff.ac.uk/USER-FILES/24007-sopnz-Nottingham/media/score.png" width="420" />
  </div>
  <footer class="title-page__footer">
    <p>&copy; Cardiff University Learning and Teaching Academy
    </p>
    <button id="dark-mode-toggle" class="dark-mode-toggle" type="button" aria-pressed="false" aria-label="Enable dark mode">
      <span class="dark-mode-toggle__icon">☾</span>
      <span class="dark-mode-toggle__label">Dark mode</span>
    </button>
  </footer>
</main>
<!-- Toast Notification (include on every page) -->
<div id="toast">Changes Saved
</div>

<script>
(function () {
  function applyDarkMode(isDark) {
    $('body').toggleClass('dark-mode', isDark);
    $('#dark-mode-toggle')
      .attr('aria-pressed', isDark ? 'true' : 'false')
      .attr('aria-label', isDark ? 'Disable dark mode' : 'Enable dark mode')
      .find('.dark-mode-toggle__icon').text(isDark ? '☀' : '☾').end()
      .find('.dark-mode-toggle__label').text(isDark ? 'Light mode' : 'Dark mode');
  }

  function syncDarkMode() {
    applyDarkMode(localStorage.getItem('svem-dark-mode') === 'dark');
  }

  window.applySVEMDarkMode = syncDarkMode;

  syncDarkMode();
  requestAnimationFrame(syncDarkMode);
  setTimeout(syncDarkMode, 0);
  setTimeout(syncDarkMode, 100);

  $('#dark-mode-toggle').on('click', function () {
    var isDark = !$('body').hasClass('dark-mode');
    localStorage.setItem('svem-dark-mode', isDark ? 'dark' : 'light');
    applyDarkMode(isDark);
  });
})();
</script>
