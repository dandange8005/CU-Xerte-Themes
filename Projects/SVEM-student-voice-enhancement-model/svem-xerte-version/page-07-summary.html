<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<script>
    // Summary Page JavaScript
// Generates report from localStorage data

// Configuration Constants (shared with scoring-xerte.js)
const CONFIG = {
    STORAGE_PREFIX: 'sv_',
    THEMES_OVERVIEW_PAGE_ID: 'PG1765898999143',
    TOAST_DURATION: 2000,
    NAVIGATION_DELAY: 500,
    RELOAD_DELAY: 1500,
    VISIBILITY_CHECK_INTERVAL: 500,
    CHART_INIT_RETRY: 100
};

// LocalStorage Utility Functions (shared with scoring-xerte.js)
function getSectionData(sectionId) {
    try {
        const data = localStorage.getItem(`${CONFIG.STORAGE_PREFIX}${sectionId}`);
        return data ? JSON.parse(data) : { score: 0, note: '' };
    } catch (e) {
        console.error(`Error reading section ${sectionId}:`, e);
        return { score: 0, note: '' };
    }
}

// Global variable to store chart instance
let spiderChartInstance = null;

// Section configuration
const SECTIONS = {
    'Theme 1: Structures Supporting Student Voice': {
        sections: [
            { id: 'roles', name: 'Roles and Structures' },
            { id: 'training', name: 'SV Training, Development, and Dissemination' }
        ]
    },
    'Theme 2: Student Reps and SSPs': {
        sections: [
            { id: 'reps-ssps', name: 'Student Reps and Student-Staff Panels' }
        ]
    },
    'Theme 3: Formal Mechanisms': {
        sections: [
            { id: 'mme', name: 'Mid-Module Enhancement' },
            { id: 'me', name: 'End of Module Enhancement' },
            { id: 'nss', name: 'National Student Survey (NSS)' },
            { id: 'pg', name: 'Cardiff University PG Surveys (CUPTS & PRES)' }
        ]
    }
};

// Short labels for spider chart (prevents label overlap)
const SECTION_SHORT_LABELS = {
    'roles': 'Roles',
    'training': 'Training',
    'reps-ssps': 'Reps/SSPs',
    'mme': 'MME',
    'me': 'ME',
    'nss': 'NSS',
    'pg': 'PG Surveys'
};

// Get maturity level name
function getMaturityLevelName(score) {
    if (!score) return 'Not Scored';
    const level = Math.floor(score);
    const isTransitional = score % 1 !== 0;

    const levels = {
        1: 'Moving towards Baseline',
        2: 'Baseline Practice',
        3: 'Emerging Good Practice',
        4: 'Established Strong Practice',
        5: 'Exceptional Practice'
    };

    if (isTransitional) {
        return `Transitioning (${levels[level]} → ${levels[level + 1]})`;
    }
    return levels[level];
}

// Generate spider chart
function generateSpiderChart() {
    const ctx = document.getElementById('spiderChart');
    if (!ctx) return;

    // Collect all section data
    const labels = [];
    const scores = [];
    const allSections = [];

    // Flatten all sections
    Object.keys(SECTIONS).forEach(themeName => {
        const theme = SECTIONS[themeName];
        theme.sections.forEach(section => {
            allSections.push(section);
        });
    });

    // Get scores for each section with shortened labels for better chart readability
    const sectionData = []; // Store section info for tooltips
    allSections.forEach(section => {
        // Use shortened labels to prevent overlap in the chart
        const shortLabel = SECTION_SHORT_LABELS[section.id] || section.name;

        labels.push(shortLabel);
        const savedData = getSectionData(section.id);
        scores.push(savedData.score || 0);
        sectionData.push({ name: section.name, shortLabel: shortLabel });
    });

    // Destroy existing chart if it exists
    if (spiderChartInstance) {
        spiderChartInstance.destroy();
    }

    // Create new chart
    spiderChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Current Assessment',
                data: scores,
                fill: true,
                backgroundColor: 'rgba(0, 51, 102, 0.2)',
                borderColor: 'rgb(0, 51, 102)',
                pointBackgroundColor: 'rgb(0, 51, 102)',
                pointBorderColor: '#fff',
                pointHoverBackgroundColor: '#fff',
                pointHoverBorderColor: 'rgb(0, 51, 102)',
                pointRadius: 4,
                pointHoverRadius: 6,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
                r: {
                    angleLines: {
                        display: true,
                        color: 'rgba(0, 0, 0, 0.1)'
                    },
                    suggestedMin: 0,
                    suggestedMax: 5,
                    ticks: {
                        stepSize: 1,
                        backdropColor: 'transparent',
                        font: {
                            size: 11
                        }
                    },
                    pointLabels: {
                        font: {
                            size: 11,
                            weight: '500'
                        },
                        color: '#2c3e50'
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.1)'
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            const index = context[0].dataIndex;
                            return sectionData[index].name;
                        },
                        label: function(context) {
                            const score = context.parsed.r;
                            if (score === 0) return 'Not Scored';
                            const levelName = getMaturityLevelName(score);
                            return `Level ${score} - ${levelName}`;
                        }
                    }
                }
            },
            animation: {
                duration: 0 // Disable animation for better printing/PDF generation
            }
        }
    });
}

// Create section report HTML
function createSectionReportHTML(section, savedData) {
    const hasScore = savedData && savedData.score;
    const levelName = hasScore ? getMaturityLevelName(savedData.score) : 'Not Scored';
    const scoreClass = hasScore ? `level-${Math.floor(savedData.score)}` : 'not-scored';
    const scoreLabel = hasScore ? `Level ${savedData.score}` : 'Not Scored';

    const evidenceHTML = hasScore
        ? (savedData.note?.trim()
            ? `<strong>Evidence:</strong><p>${savedData.note}</p>`
            : `<em style="color: #999;">No evidence provided</em>`)
        : '';

    return `
        <div class="section-report">
            <div class="section-report__header">
                <h4 class="section-report__name">${section.name}</h4>
                <div class="section-report__score">
                    <span class="score-indicator ${scoreClass}">${scoreLabel}</span>
                    ${hasScore ? `<span class="maturity-level">${levelName}</span>` : ''}
                </div>
            </div>
            ${evidenceHTML ? `<div class="section-report__evidence">${evidenceHTML}</div>` : ''}
        </div>
    `;
}

// Update statistics display
function updateStatistics(stats) {
    document.getElementById('completed-count').textContent = stats.completed;
    const completionPercent = Math.round((stats.completed / stats.total) * 100);
    document.getElementById('completion-percent').textContent = `${completionPercent}%`;

    const averageScore = stats.scored > 0
        ? (stats.totalScore / stats.scored).toFixed(1)
        : '0.0';
    document.getElementById('average-score').textContent = averageScore;

    updateStatusBadge(stats.completed, stats.total);
}

// Update status badge
function updateStatusBadge(completed, total) {
    const statusEl = document.getElementById('report-status');
    const statusConfig = {
        complete: { text: 'Complete', color: '#27ae60' },
        inProgress: { text: 'In Progress', color: '#f39c12' },
        notStarted: { text: 'Not Started', color: '#999' }
    };

    const status = completed === total ? 'complete'
        : completed > 0 ? 'inProgress'
        : 'notStarted';

    statusEl.textContent = statusConfig[status].text;
    statusEl.style.color = statusConfig[status].color;
    statusEl.style.fontWeight = completed > 0 ? '600' : 'normal';
}

// Generate report
function generateReport() {
    const reportDate = new Date().toLocaleDateString('en-GB', {
        year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('report-date').textContent = reportDate;

    let stats = { completed: 0, total: 0, totalScore: 0, scored: 0 };

    const reportHTML = Object.entries(SECTIONS).map(([themeName, theme]) => {
        const sectionsHTML = theme.sections.map(section => {
            stats.total++;
            const savedData = getSectionData(section.id);

            if (savedData.score) {
                stats.completed++;
                stats.totalScore += savedData.score;
                stats.scored++;
            }

            return createSectionReportHTML(section, savedData);
        }).join('');

        return `
            <div class="theme-report">
                <h3 class="theme-report__title">${themeName}</h3>
                ${sectionsHTML}
            </div>
        `;
    }).join('');

    document.getElementById('report-body').innerHTML = reportHTML;
    updateStatistics(stats);
}

// Download report as HTML file
function downloadReportHTML() {
    // Get the report content and styles
    var reportContent = document.querySelector('.summary-page').outerHTML;
    var styles = document.querySelector('style').textContent;
    var reportDate = new Date().toLocaleDateString('en-GB');
    var fileName = 'SVEM-Report-' + new Date().toISOString().split('T')[0] + '.html';

    // Additional styles for standalone report
    var standaloneStyles = '\n' +
        '/* Standalone Report Styles */\n' +
        'body {\n' +
        '    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;\n' +
        '    line-height: 1.6;\n' +
        '    color: #333;\n' +
        '    background: #f5f5f5;\n' +
        '    margin: 0;\n' +
        '    padding: 20px;\n' +
        '}\n' +
        '.summary-page {\n' +
        '    background: white;\n' +
        '    max-width: 1000px;\n' +
        '    margin: 0 auto;\n' +
        '    padding: 2rem;\n' +
        '    box-shadow: 0 0 10px rgba(0,0,0,0.1);\n' +
        '}\n' +
        '/* Hide buttons and navigation in standalone report */\n' +
        '.report-actions,\n' +
        '.page-navigation {\n' +
        '    display: none !important;\n' +
        '}\n' +
        '/* Improve text readability */\n' +
        'h2, h3, h4 {\n' +
        '    line-height: 1.3;\n' +
        '    margin-top: 1.5rem;\n' +
        '    margin-bottom: 0.75rem;\n' +
        '}\n' +
        'p {\n' +
        '    margin: 0.5rem 0;\n' +
        '    line-height: 1.6;\n' +
        '}\n' +
        '.section-report__evidence p {\n' +
        '    white-space: pre-wrap;\n' +
        '    word-wrap: break-word;\n' +
        '}\n' +
        '/* Print styles */\n' +
        '@media print {\n' +
        '    body { background: white; padding: 0; }\n' +
        '    .summary-page { box-shadow: none; }\n' +
        '    .report-actions, .page-navigation { display: none !important; }\n' +
        '    .theme-report { page-break-inside: avoid; }\n' +
        '}\n';

    // Create standalone HTML document
    var fullHTML = '<!DOCTYPE html>\n' +
        '<html lang="en">\n' +
        '<head>\n' +
        '    <meta charset="UTF-8">\n' +
        '    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
        '    <title>SVEM Self-Assessment Report - ' + reportDate + '</title>\n' +
        '    <style>' + styles + standaloneStyles + '</style>\n' +
        '</head>\n' +
        '<body>\n' +
        reportContent + '\n' +
        '</body>\n' +
        '</html>';

    // Create and download file
    var blob = new Blob([fullHTML], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('Report downloaded successfully');
}

// Download data as JSON
function downloadJSON() {
    const allData = {
        metadata: {
            title: 'SVEM Self-Assessment Report',
            date: new Date().toISOString(),
            version: '1.0'
        },
        assessmentData: {}
    };

    // Collect all section data
    Object.keys(SECTIONS).forEach(themeName => {
        const theme = SECTIONS[themeName];
        theme.sections.forEach(section => {
            const savedData = getSectionData(section.id);
            if (savedData.score > 0 || savedData.note) {
                allData.assessmentData[section.id] = {
                    sectionName: section.name,
                    score: savedData.score || null,
                    maturityLevel: getMaturityLevelName(savedData.score),
                    evidence: savedData.note || ''
                };
            }
        });
    });

    // Create and download file
    const dataStr = JSON.stringify(allData, null, 2);
    const dataBlob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `SVEM-Assessment-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    // Show toast
    showToast('Data downloaded successfully');
}

// Show toast notification
function showToast(message) {
    const toast = document.getElementById('toast');
    if (toast) {
        toast.textContent = message || 'Report Generated';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), CONFIG.TOAST_DURATION);
    }
}

// Create visibility watcher for element
function createVisibilityWatcher(element, callback) {
    let lastVisibleState = false;

    const checkVisibility = () => {
        const isVisible = element.offsetParent !== null;
        if (isVisible && !lastVisibleState) {
            callback();
        }
        lastVisibleState = isVisible;
    };

    return setInterval(checkVisibility, CONFIG.VISIBILITY_CHECK_INTERVAL);
}

// Generate report on page load AND when page becomes visible
(function() {
    // Wait for Chart.js to load
    function initializeReports() {
        if (typeof Chart === 'undefined') {
            setTimeout(initializeReports, CONFIG.CHART_INIT_RETRY);
            return;
        }

        // Run on initial load
        generateReport();
        generateSpiderChart();

        // Also run when page becomes visible (handles Xerte navigation)
        const summaryPageElement = document.querySelector('.summary-page');
        if (summaryPageElement) {
            const intervalId = createVisibilityWatcher(summaryPageElement, () => {
                generateReport();
                generateSpiderChart();
            });
            window._summaryPageInterval = intervalId;
        }

        // Alternative: Listen for focus/visibility events
        window.addEventListener('focus', function() {
            if (summaryPageElement && summaryPageElement.offsetParent !== null) {
                generateReport();
                generateSpiderChart();
            }
        });

        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && summaryPageElement && summaryPageElement.offsetParent !== null) {
                generateReport();
                generateSpiderChart();
            }
        });
    }

    // Start initialization
    initializeReports();
})();
</script>
